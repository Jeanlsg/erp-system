# Cabeçalhos de segurança — incluído no server e em CADA location do nginx.conf.
#
# ⚠️ Um add_header dentro de uma location apaga todos os do server. Era o que
# acontecia (varredura de 03/11/2026): "/" cai em "location = /index.html",
# que só punha Cache-Control, e o site saía sem nenhum destes — o ERP podia
# ser embutido num iframe de outro site.
#
# __SUPABASE__ / __SUPABASE_WS__: o Dockerfile troca pela origem de
# VITE_SUPABASE_URL (https e wss), sem escrever o endereço no repositório.
#
# CSP: só script do próprio site (e o chart.js do jsDelivr). As janelas de
# impressão herdam esta política: por isso o print é chamado pelo ERP
# (src/lib/imprimir.ts), não por <script> dentro do documento. Imagem de
# qualquer https (foto de produto pode vir de fora); ViaCEP para o CEP.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' __SUPABASE__ __SUPABASE_WS__ https://viacep.com.br; media-src 'self' blob: https:; worker-src 'self' blob:; frame-src 'self' blob: __SUPABASE__; object-src 'self' blob:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# câmera: leitor de código de barras do PDV
add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=()" always;
add_header Strict-Transport-Security "max-age=31536000" always;
